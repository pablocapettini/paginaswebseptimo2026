<!DOCTYPE html>
<html lang="es">

<head>

    <!-- ===================================== -->
    <!--      CONFIGURACIÓN DE LA PÁGINA        -->
    <!-- ===================================== -->

    <!-- Conecta el archivo CSS -->
    <link rel="stylesheet" href="stayle.css">

    <!-- Permite usar la ñ y los acentos -->
    <meta charset="UTF-8">

    <!-- Hace que la página se vea bien en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la pestaña -->
    <title>Trivia de KATSEYE</title>

</head>

<body>

    <!-- ===================================== -->
    <!--        BOTÓN FLOTANTE ATRÁS           -->
    <!-- ===================================== -->

    <a href="javascript:history.back()" class="boton-atras">

        <!-- Círculo con la flecha -->
        <div class="circulo">⬅</div>

        <!-- Texto del botón -->
        <span>Atrás</span>

    </a>

    <!-- ===================================== -->
    <!--      CONTENEDOR PRINCIPAL             -->
    <!-- ===================================== -->

    <div class="trivia">

        <!-- Título -->
        <h1>💜 TRIVIA DE KATSEYE 💜</h1>

        <!-- Texto de bienvenida -->
        <p class="bienvenida">

            ¿Cuánto sabés sobre KATSEYE?<br>
            Respondé las preguntas y descubrí si sos una verdadera fan. ✨

        </p>

        <!-- Puntaje -->
        <h3 id="puntaje">

            ⭐ Puntaje: 0 / 10

        </h3>

        <!-- Número de pregunta -->
        <h4 id="numeroPregunta">

            Pregunta 1 de 10

        </h4>

        <!-- Aquí aparecerá la pregunta -->
        <h2 id="pregunta"></h2>

        <!-- Aquí aparecerán los botones de las respuestas -->
        <div id="respuestas"></div>

        <!-- Mensaje de correcta o incorrecta -->
        <p id="mensaje"></p>

        <!-- Botón para pasar a la siguiente pregunta -->
        <button id="siguiente">

            ➜ Siguiente

        </button>

    </div>

    <!-- ===================================== -->
    <!--    PANTALLA FINAL DE LA TRIVIA        -->
    <!-- ===================================== -->

    <div id="resultadoFinal">

        <!-- Título -->
        <h1>🏆 ¡TRIVIA TERMINADA!</h1>

        <!-- Puntaje obtenido -->
        <h2 id="resultado"></h2>

        <!-- Mensaje final -->
        <p id="fraseFinal"></p>

        <!-- Botón para volver a empezar -->
        <button onclick="location.reload()">

            🔄 Jugar otra vez

        </button>

    </div>

    <!-- ===================================== -->
    <!--     CONECTA EL JAVASCRIPT             -->
    <!-- ===================================== -->

    <script src="script.js"></script>

</body>

</html>
